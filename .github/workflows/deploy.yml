name: Deploy static content to Pages

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Lint, content, responsive UX, accessibility, and performance
        run: npm run lint && npm run check && npm run build && npm run test:browser && npm run test:cross-browser && npm run test:performance
      - name: Visual regression (compare vs baseline on PRs, update on main)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run test:visual
          else
            UPDATE_VISUALS=1 node scripts/visual-regression.mjs
          fi
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Preserve visual evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-evidence
          path: artifacts/visual/
          retention-days: 14
      - name: Upload tested site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  update-baselines:
    name: Refresh visual baselines (Linux)
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Regenerate baselines on Linux
        run: npm run build && UPDATE_VISUALS=1 node scripts/visual-regression.mjs
      - name: Commit updated baselines if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/visual-baselines/
          if git diff --cached --quiet; then
            echo "No baseline changes."
          else
            git commit -m "chore: update visual baselines [skip ci]"
            git push
          fi

  deploy:
    name: Deploy and verify production
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/configure-pages@v6
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify exact release and live functionality
        run: npm run verify:deploy -- --live-only

