name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate assets and dictionaries
        run: npm run lint && npm run check

      - name: Build static distribution
        run: npm run build

      - name: Run browser smoke & accessibility tests
        run: npm run test:browser

      - name: Run performance budgets
        run: npm run test:performance

      - name: Generate visual evidence
        run: npm run test:visual
        env:
          UPDATE_VISUALS: "1"

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-evidence
          path: artifacts/visual/

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire dist directory
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
